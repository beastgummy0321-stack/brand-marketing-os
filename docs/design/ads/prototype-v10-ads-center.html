<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 v10｜投放中心</title>
<style>
/* Prototype v10 (single file, final look). Fake deterministic data only; no network, no backend.
   Copied from v9; v10 changes: period settle flow, A/B loser, background-job progress + read failure, month review,
   cleanup untick, publish launch settings + readback, home handoff row state, "換掉這一則" material request.
   Tokens from docs/design-system.md §2 (unchanged). Signature visual: the target ruler (ruler()). */
:root{--bg:#f6f7fb;--fg:#202237;--card:#fff;--primary:#7055d8;--secondary:#f0edf9;--muted:#f0f2f7;--mfg:#626b80;--accent:#f1edfc;--afg:#6348c5;--border:#e3e6ef;--input:#dce0ea;--success:#238169;--warning:#a96711;--danger:#c53945;--irrev:#ba591c;--r:12px;
 --g-ok:#238169;--g-watch:#d18a1f;--g-over:#e0707a;--g-stop:#c53945;--g-thin:#c9cede;--z-ok:#e4f3ee;--z-watch:#faefdc;--z-over:#fbe6e8;
 --c1:#7055d8;--c2:#397cda;--c3:#2ea7af;--c4:#a397e9;--c5:#8892a8;--side:232px;--hatch:repeating-linear-gradient(45deg,#e3e6ef 0 4px,#f6f7fb 4px 8px)}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Inter","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.45}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}
h1{font-size:26px;font-weight:650;letter-spacing:-.025em;margin:0;line-height:1.25}
h2{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.num,b,td{font-variant-numeric:tabular-nums}
.mut{color:var(--mfg)}.sm{font-size:12px}.xs{font-size:11.5px}
.unk{color:#8a91a5;font-weight:500}
/* shell */
.shell{display:flex;max-width:1920px;min-height:100vh;margin:0 auto}
.side{width:var(--side);flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo{font-weight:700;font-size:16px;margin:0 6px 18px}.logo b{color:var(--primary)}
.brand{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:16px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:7px;margin-bottom:2px;font-weight:500}
.nav button:hover{background:var(--muted)}.nav button.on{background:var(--accent);color:var(--afg);font-weight:600}
.proto{margin-top:auto;border:1px dashed #c9cede;border-radius:8px;padding:10px;font-size:11.5px;color:var(--mfg);line-height:1.45}
.proto b{display:block;margin:6px 0 2px;color:var(--fg)}.proto b:first-child{margin-top:0}
.proto button{background:none;border:0;padding:1px 0;color:var(--primary);font-size:11.5px;text-align:left;display:block}.proto button.on{color:var(--fg);font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;font-size:13px;color:var(--mfg);position:sticky;top:0;z-index:6}
.top .cr{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}.top .cr a{color:var(--mfg);text-decoration:none}.top .cr a:hover{color:var(--primary)}.top .cr b{color:var(--fg);font-weight:600}
.top .rt{display:flex;gap:10px;align-items:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--mfg)}
.pill:hover{border-color:var(--primary);color:var(--primary)}
.pill .ld{width:8px;height:8px;border-radius:50%;background:var(--success)}.pill .ld.warn{background:var(--g-watch)}.pill .ld.bad{background:var(--danger)}
.pill .spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--c4);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page{padding:24px 28px 32px;max-width:1260px;width:100%;flex:1;overflow-x:clip}
@media(max-width:1279px){.page{padding:20px 22px 28px}.top{padding:0 22px}}
@media(max-width:1100px){:root{--side:208px}}
/* primitives */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--muted);color:var(--mfg);white-space:nowrap}
.chip.v{background:var(--secondary);color:var(--afg)}.chip.ok{background:var(--z-ok);color:var(--success)}.chip.warn{background:var(--z-watch);color:var(--warning)}.chip.bad{background:var(--z-over);color:var(--danger)}.chip.over{background:var(--z-over);color:#b8444f}
.btn{border:1px solid var(--border);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;padding:11px 22px}.btn.pri:hover:not(:disabled){background:#6348c5;color:#fff}
.btn.s{padding:5px 12px;font-size:13px;font-weight:500}.btn.ghost{border-color:transparent;background:none;color:var(--mfg);font-weight:500}.btn.ghost:hover:not(:disabled){background:var(--muted)}
.btn.warnp{background:var(--warning);border-color:var(--warning);color:#fff}.btn.warnp:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.lnk{background:none;border:0;padding:0;color:var(--primary);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}.lnk:hover{text-decoration:underline}
.th{border-radius:8px;background:linear-gradient(135deg,#e9e2d6,#cfc3ae);position:relative;overflow:hidden;flex-shrink:0;display:inline-block}
.th:after{content:"";position:absolute;left:36%;top:22%;width:28%;height:60%;background:#f7f3ea;border-radius:12% 12% 18% 18%;box-shadow:0 -3px 0 -1px #b9ad98}
.th.b{background:linear-gradient(135deg,#9db3a0,#56705f)}.th.c{background:linear-gradient(135deg,#c9d3e6,#8091b3)}.th.d{background:linear-gradient(135deg,#ecd3cf,#b98479)}.th.x{background:var(--muted)}.th.x:after{display:none}
.nm{font-weight:600;overflow-wrap:anywhere}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.kind.stop{background:var(--z-over);color:var(--danger)}.kind.watch{background:var(--z-watch);color:var(--warning)}.kind.up{background:var(--z-ok);color:var(--success)}.kind.cut{background:#eceef4;color:#3b3f5c}.kind.gap{background:var(--z-watch);color:var(--warning)}.kind.tgt{background:var(--secondary);color:var(--afg)}
.camp{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mfg);white-space:nowrap}.camp i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;color:#fff;background:var(--c1)}
.camp i.m{background:var(--c3)}.camp i.f{background:var(--c5)}.camp i.n{background:var(--c2)}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack>*+*{margin-top:16px}
details.f{border:1px solid var(--border);border-radius:10px;background:var(--card)}
details.f>summary{padding:11px 16px;color:var(--mfg);cursor:pointer;font-weight:500;list-style:none;display:flex;gap:8px;align-items:center}
details.f>summary::-webkit-details-marker{display:none}details.f>summary:before{content:"›";display:inline-block;transition:transform .15s;font-size:16px;line-height:1}
details.f[open]>summary:before{transform:rotate(90deg)}details.f>div{padding:0 16px 16px}
.toast{position:fixed;right:24px;bottom:88px;background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;max-width:440px;pointer-events:none}.toast.on{opacity:1}
input.in,textarea.in{border:1px solid var(--input);border-radius:8px;padding:9px 12px;background:#fff;width:100%}
input.in:focus,textarea.in:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--accent)}
textarea.in{min-height:150px;resize:vertical;line-height:1.65}
.money{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:8px;background:#fff;padding:0 12px;width:180px}
.money span{color:var(--mfg)}.money input{border:0;outline:0;padding:9px 8px;font-size:16px;font-weight:600;width:100%;background:none;font-variant-numeric:tabular-nums}
.money:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--accent)}
.fld label{display:block;font-size:12px;color:var(--mfg);margin-bottom:4px}
.err{color:var(--danger);font-size:12px}
/* step header (v7) */
.sh{margin-bottom:20px}
.dots{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin-bottom:14px}
.d{width:26px;height:26px;border-radius:50%;border:0;background:var(--muted);color:var(--mfg);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0;flex-shrink:0}
.d.done{background:var(--primary);color:#fff}.d.on{background:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--accent)}.d:disabled{opacity:1;cursor:default}
.dl{font-size:12.5px;color:var(--mfg);margin:0 8px 0 7px;white-space:nowrap}.dl.on{color:var(--fg);font-weight:600}.dots s{width:18px;height:1px;background:var(--border);margin-right:8px;text-decoration:none}
.qpos{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--mfg);padding-left:16px}
.purpose{color:var(--mfg);margin-top:4px;font-size:15px}
.titlerow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
/* action bar */
.bar{position:sticky;bottom:0;background:rgb(255 255 255/.95);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:12px;z-index:5}
.bar .rt{margin-left:auto;display:flex;gap:8px;align-items:center}.bar small{color:var(--mfg);font-size:12px}
@media(max-width:1279px){.bar{padding:12px 22px}}
/* meters and bars */
.meter{position:relative;height:10px;border-radius:5px;background:var(--muted);margin:6px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transform-origin:left}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);margin-left:-1px}
.cap{font-size:11.5px;color:var(--mfg);display:flex;justify-content:space-between;gap:8px}
.bb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--muted);margin:10px 0 8px}.bb i{display:block;transform-origin:left}
.lg{display:flex;gap:6px 16px;font-size:12px;color:var(--mfg);flex-wrap:wrap}.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.strip{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0 8px}.strip i{display:block;transform-origin:left}
.hatch{background:var(--hatch)}
/* target ruler */
.rl{display:flex;align-items:stretch;gap:8px}
.rl .ax{position:relative;flex:1;min-width:0}
.rl .fd{position:relative}
.rl .trk{display:flex;height:10px;border-radius:5px;overflow:hidden;transform-origin:left}
.rl .trk i{display:block;height:100%}
.rl .mk{position:absolute;top:0;width:0;border-left:2px solid var(--fg);z-index:1}
.rl .mk.be{border-left:2px dashed var(--g-watch)}
.rl .mk span{position:absolute;top:-1px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1}
.rl .mk.l span{right:4px}.rl .mk.r span{left:4px}.rl .mk.be span{color:var(--warning)}
.rl .zl{position:relative;height:18px;font-size:11.5px;font-weight:600}.rl .zl span{position:absolute;top:3px;white-space:nowrap}
.rl .sb{flex-shrink:0;border-radius:8px;background:var(--z-over);border:1px dashed #e6a3aa;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 0 22px;gap:4px}
.dt.hl .dd{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary)}.dt.cx .dd{box-shadow:0 0 0 1.5px #fff,0 0 0 3.5px var(--danger)}
.rl .sb>em{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-style:normal;font-size:11.5px;font-weight:700;color:var(--danger)}
.dt{position:absolute;border:0;padding:0;background:none;border-radius:50%;z-index:2}
.dt .th,.dt .dd{display:block;border-radius:50%}
.dt .dd{width:100%;height:100%;border:2px solid #fff}
.dt.ok .th{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g-ok)}.dt.watch .th{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g-watch)}.dt.over .th{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g-over)}.dt.stop .th{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g-stop)}
.dt.ok .dd{background:var(--g-ok)}.dt.watch .dd{background:var(--g-watch)}.dt.over .dd{background:var(--g-over)}.dt.stop .dd{background:var(--g-stop)}.dt.na .dd{background:var(--c5)}
.dt.dim{opacity:.35}.dt.hl .th{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary),0 0 0 8px var(--accent)}
.dt .bx{position:absolute;right:-7px;top:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;font-size:10.5px;font-weight:700;display:grid;place-items:center;color:#fff;background:var(--danger);border:2px solid #fff;font-style:normal}
.dt .bx.k{background:var(--success)}
.dt .tip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:max-content;max-width:260px;background:var(--fg);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.5;text-align:left;font-weight:400;z-index:9;pointer-events:none}
.dt .tip.tl{left:-4px;transform:none}.dt .tip.tr{left:auto;right:-4px;transform:none}
.dt:hover .tip,.dt:focus-visible .tip{display:block}
.tray{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--muted)}
.tray .tl{font-size:12px;font-weight:600;color:var(--mfg)}
.tray .ti{display:flex;gap:8px;align-items:center;min-width:180px;flex:1;max-width:280px}
.tray .ti .meter{height:6px;margin:3px 0 2px;background:#fff}
.rl-empty{border-radius:8px;height:10px;background:var(--hatch)}
/* motion: first paint of a screen only */
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
@keyframes rise{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
.fresh .gr,.fresh .meter i,.fresh .bb i,.fresh .strip i,.fresh .rl .trk{animation:grow .28s cubic-bezier(.2,.7,.3,1) both}
.fresh .dt{animation:pop .26s cubic-bezier(.2,.7,.3,1) both;animation-delay:.12s}
.fresh .vbar{animation:rise .3s ease-out both}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* home (approved "Fused" layout): title, next-up strip, money + budget pace, money-quality band, decisions, campaigns */
.hstack{display:flex;flex-direction:column;gap:20px}
.chip.stop{background:#f7d3d6;color:#b0303b}
.nextup{padding:14px 24px;display:flex;align-items:center;gap:24px}
.nextup .tlg{flex:1;min-width:0;position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.nextup .tlg:before{content:"";position:absolute;left:6px;right:12%;top:6px;height:2px;background:var(--border)}
.nextup .ti{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px;min-width:0}
.nextup .dot{width:14px;height:14px;border-radius:50%;box-sizing:border-box}
.moneyg{padding:24px 28px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:36px;align-items:center}
@media(max-width:1180px){.moneyg{grid-template-columns:minmax(0,1fr);gap:24px}}
.cpm{margin-top:10px;position:relative;height:10px;border-radius:6px;background:var(--muted)}
.cpm i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:left}.cpm u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.paceh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding:12px 14px;background:var(--accent);border-radius:10px}
.bandc{padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.band{display:flex;height:128px;gap:4px}
.band>div{border-radius:4px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.band>div:first-child{border-radius:10px 4px 4px 10px}.band>div:last-child{border-radius:4px 10px 10px 4px}
.band .sl{font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.decg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:1100px){.decg{grid-template-columns:minmax(0,1fr)}}
.dcard{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dcard .dr{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.ct{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,.8fr) 120px;gap:16px;padding:14px 24px;border-top:1px solid var(--border);align-items:center}
.ct.hd0{border-top:0;padding:10px 24px;font-size:12px;color:var(--mfg)}
.ct .act{text-align:right}
.hb{position:relative;height:8px;background:var(--muted);border-radius:5px}.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transform-origin:left}.hb u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.fresh .cpm i,.fresh .hb i{animation:grow .28s cubic-bezier(.2,.7,.3,1) both}
.q{display:grid;grid-template-columns:48px minmax(0,1fr) 210px auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--border)}
.q:first-child{border-top:0}.q.done{background:#fafbfd}.q.done .th,.q.done .qi{opacity:.5}
.q .qi{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--accent);color:var(--afg)}
.q .act{justify-self:end}
@media(max-width:1180px){.q{grid-template-columns:44px minmax(0,1fr) 180px auto;gap:12px;padding:14px 16px}}
.cc .rl{margin-top:4px}
.capdots{display:flex;gap:3px;align-items:center}.capdots i{width:12px;height:12px;border-radius:3px;background:var(--c4)}.capdots i.x{background:#fff;border:1.5px solid var(--g-watch)}.capdots u{width:2px;height:18px;background:var(--fg);margin:0 3px}
.days{display:flex;gap:4px}.days i{width:24px;height:24px;border-radius:6px;background:var(--c1);display:grid;place-items:center;font-style:normal;font-size:10.5px;color:#fff;font-weight:600}
.days i.x{background:#fff;border:1.5px dashed var(--danger);color:var(--danger)}.days i.f{background:var(--muted);color:var(--mfg)}
.empty{display:flex;gap:16px;align-items:center;padding:28px 24px}.empty .big{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff;background:var(--success);flex-shrink:0}
.skel{height:14px;border-radius:6px;background:var(--muted)}
/* workspace */
.rail{display:flex;align-items:center;gap:0;margin:16px 0 18px;flex-wrap:wrap;row-gap:8px}
.rail button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;border-radius:8px;color:var(--mfg);font-weight:500;font-size:13px}
.rail button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--muted);font-size:11.5px;font-weight:700}
.rail button.dn i{background:var(--secondary);color:var(--afg)}.rail button.on{color:var(--fg);font-weight:700}.rail button.on i{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--accent)}
.rail s{flex:0 0 28px;height:2px;background:var(--border);text-decoration:none}.rail s.dn{background:var(--c4)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}

  if (k === "settle:wait") { S.settle.ai = false; return go("#/d/settle/angle"); }
  if (k === "handoff") { const q = Q("scale2"); q.st = "approved"; q.checks = 0; q.todo = q.todo[0] && q.todo[1] ? {} : { 0: true, 1: true }; return go("#/"); }
  if (k === "stale") {
    const c = CAMPS.fall; delete S.pub.fall; const p = pubOf(c);
    p.approved = true; p.version = 1;
    p.items.forEach((x) => (x.st = [1, 3, p.items.length].includes(x.id) ? "ok" : "todo"));
    const oldName = p.items[3].name;
    p.diff = [{ item: 2, field: "每日預算", before: "500", after: "600" }, { item: 4, field: "廣告名稱", before: oldName, after: oldName.replace("）", "・限量）") }];
    p.diff.forEach((d) => applyDiff(c, p, d, d.after));
    p.stale = true; return go("#/pub/fall/platform");
  }
}
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-demo]"); if (d) { demo(d.dataset.demo); return; }
  const el = e.target.closest("[data-act],[data-go],[data-toast]"); if (!el || el.disabled) return;
  if (el.dataset.go) { e.preventDefault(); go(el.dataset.go); return; }
  if (el.dataset.toast) { toast(el.dataset.toast); return; }
  const f = act[el.dataset.act]; if (f) f(el.dataset.arg, el); else toast("原型：這顆按鈕的動作還沒做");
});
// v10: folded areas keep their open state across re-renders (data-keep); publish settings apply on change.
document.addEventListener("toggle", (e) => { const d = e.target; if (d && d.dataset && d.dataset.keep) S.open[d.dataset.keep] = d.open; }, true);
document.addEventListener("change", (e) => {
  const el = e.target, m = location.hash.match(/^#\/pub\/(\w+)/); if (!m || !S.pub[m[1]] || S.pub[m[1]].approved) return;
  const p = S.pub[m[1]];
  if (el.dataset.set === "utm") return; // UTM updates in place on input (a re-render here would swallow the next click)
  if (el.dataset.set) { const k = el.dataset.set; p.set[k] = el.value; p.edited[k === "age0" || k === "age1" ? "age" : k] = true; route(); refocus(`[data-set="${k}"]`); }
  else if (el.dataset.setp) { const v = el.dataset.setp, L = p.set.places; p.set.places = el.checked ? (L.includes(v) ? L : L.concat(v)) : L.filter((x) => x !== v); p.edited.place = true; route(); refocus(`[data-setp="${v}"]`); }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "set-utm") return;
  const c = curC(), p = c && S.pub[c.id]; if (!p || p.approved) return;
  p.set.utm = e.target.value; p.edited.utm = true;
  const m = $("#utmMsg"); if (m) m.innerHTML = utmMsg(e.target.value);
  const b = bar.querySelector('[data-act="pubApprove"]'), err = setErr(p.set), h = bar.querySelector("small");
  if (b) b.disabled = !!err; if (h) h.textContent = err ? `${err}，先在「投放設定」改好` : "核准不會改動平台";
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.jobsOpen) { S.jobsOpen = false; topRight(); refocus('[data-act="toggleJobs"]'); } });

// ============ router ============
function route() {
  const h = location.hash || "#/", fresh = h !== S.lastRoute; S.lastRoute = h;
  app.classList.toggle("fresh", fresh);
  if (fresh) S.jobsOpen = false;
  S.exit = null; S.beSeen = false; S.rulesSeen = false; S.noteSeen = false; S.moneySeen = false;
  topRight(); protoBox();
  let m;
  if (h === "#/month" || h === "#/month/9") { S.month = 9; month(); }
  else if (h === "#/month/8") { S.month = 8; month(); }
  else if (h === "#/connections") connections();
  else if (h === "#/new" || h === "#/new/1") newStep1();
  else if (h === "#/new/2") newStep2();
  else if ((m = h.match(/^#\/wait\/(\w+)/))) return go(`#/camp/${m[1]}/overview`);
  else if ((m = h.match(/^#\/camp\/(\w+)(?:\/(\w+))?/)) && CAMPS[m[1]]) campPage(m[1], m[2] || "overview");
  else if ((m = h.match(/^#\/d\/(\w+)\/(\w+)/))) flowPage(m[1], m[2]);
  else if ((m = h.match(/^#\/pub\/(\w+)(?:\/(\w+))?/))) pubPage(m[1], m[2] || "list");
  else home();
  if (fresh) window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
