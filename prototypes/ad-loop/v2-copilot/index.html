<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumiBrew 投放助理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">L</span><span>LumiBrew 投放助理</span></div>
      <div class="topbar-actions">
        <button class="text-button" id="reset-demo" type="button">重設示範</button>
        <button class="icon-button sidebar-toggle" id="sidebar-toggle" type="button" aria-label="開啟狀態側欄" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <main class="conversation-pane">
        <div class="conversation" id="conversation" aria-live="polite"></div>
      </main>

      <aside class="status-sidebar" id="status-sidebar" aria-label="投放狀態摘要">
        <div class="sidebar-inner" id="sidebar-content"></div>
      </aside>
    </div>

    <div class="approval-bar" id="approval-bar" hidden></div>

    <form class="composer" id="composer-form">
      <div class="composer-inner">
        <input id="composer-input" type="text" autocomplete="off" placeholder="完成前面的步驟後，這裡會告訴你下一步" disabled>
        <button class="send-button" id="send-button" type="submit" aria-label="送出" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3.5-8L4 4Z"></path><path d="M7.5 12H20"></path></svg>
        </button>
      </div>
    </form>
  </div>
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
