<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>沐光投顧｜目標倒推型投放顧問</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="沐光投顧首頁">沐光投顧</a>
      <button class="reset-button is-hidden" type="button" data-action="reset">重設示範</button>
    </div>
  </header>

  <main id="top">
    <nav class="progress-track" aria-label="投組進度"><ol id="progressSteps"></ol></nav>
    <div id="app" class="app-shell"></div>
  </main>

  <div id="fundOverlay" class="fund-overlay" aria-live="polite" aria-hidden="true">
    <div class="fund-overlay__content">
      <svg class="fund-flow" viewBox="0 0 360 220" aria-hidden="true">
        <circle class="fund-core" cx="180" cy="70" r="29"></circle>
        <path d="M163 95 C130 130 76 126 58 168"></path>
        <path d="M180 99 L180 167"></path>
        <path d="M197 95 C230 130 284 126 302 168"></path>
        <circle class="fund-node meta-node" cx="55" cy="174" r="18"></circle>
        <circle class="fund-node google-node" cx="180" cy="178" r="18"></circle>
        <circle class="fund-node tiktok-node" cx="305" cy="174" r="18"></circle>
        <text x="180" y="77" text-anchor="middle">投組</text>
        <text x="55" y="179" text-anchor="middle">M</text>
        <text x="180" y="183" text-anchor="middle">G</text>
        <text x="305" y="179" text-anchor="middle">T</text>
      </svg>
      <p>投組撥付中</p>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
