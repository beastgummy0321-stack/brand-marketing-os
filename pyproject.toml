[tool.pyright]
include = ["app"]
exclude = ["app/tests"]
typeCheckingMode = "basic"
# pinned Windows (not the CI runner's Linux default): app/core/creative_assets.py
# calls os.startfile() deliberately (decision 0008, desktop-only helper); without
# this pin, Pyright loads Linux typeshed stubs where os.startfile doesn't exist
# and flags a false error that doesn't reproduce on this repo's actual (Windows)
# deployment target for that code path.
pythonPlatform = "Windows"
# pin the project venv so every caller (bare `pyright`, editor LSP, CI) analyses the
# same interpreter. Without this, pyright falls back to the first `python` on PATH —
# on a dev box that is the global 3.12, which lacks procrastinate and resolves `jwt`
# to app/identity/jwt.py itself, producing 12 errors that do not exist.
venvPath = "."
venv = ".venv"
ignore = [
    # frozen 2026-08-28, shrink only (ticket 02-7): files with pre-existing
    # pyright errors at the time Pyright was introduced. New files must pass
    # clean; only remove entries as files are fixed, never add for new code.
    "app/brand_intelligence/personas.py",
    "app/brand_intelligence/repository.py",
    "app/brand_intelligence/repository_channels.py",
    "app/brand_web/report_service.py",
    "app/brand_web/routes.py",
    "app/brand_web/routes_library.py",
    "app/brand_web/routes_library_write.py",
    "app/brand_web/routes_product_helpers.py",
    "app/brand_web/routes_products.py",
    "app/brand_web/routes_report_api.py",
    "app/core/calendar_dismiss.py",
    "app/core/settings.py",
    "app/intake/ai.py",
    "app/intake/paste_parse.py",
    "app/intake/repository.py",
    "app/intake/routes_api.py",
    "app/intake/routes_t2_api.py",
    "app/intake/script.py",
    "app/intake/state.py",
    "app/llm/gateway.py",
