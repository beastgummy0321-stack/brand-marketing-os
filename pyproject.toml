[project]
name = "brand-marketing-os"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "python-multipart==0.0.32",
    "openpyxl==3.1.5",
    "anthropic==0.122.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "google-analytics-data==0.23.0",
    "psycopg[binary,pool]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff",
    "pyright",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
