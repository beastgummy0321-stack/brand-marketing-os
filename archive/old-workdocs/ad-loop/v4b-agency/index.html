<!doctype html>

        <circle class="launch-node tiktok-node" cx="305" cy="174" r="18"></circle>
        <text x="180" y="77" text-anchor="middle">開跑</text>
        <text x="55" y="179" text-anchor="middle">M</text>
        <text x="180" y="183" text-anchor="middle">G</text>
        <text x="305" y="179" text-anchor="middle">T</text>

  <script src="mock-data.js"></script>
